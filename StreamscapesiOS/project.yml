name: streamscapes.fm
options:
  bundleIdPrefix: com.streamscapes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  Streamscapes:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - sdk: WatchConnectivity.framework
      - target: StreamscapesWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamscapes.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/Streamscapes.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: streamscapes.fm
        CFBundleName: streamscapes.fm
        UILaunchScreen:
          UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Streamscapes uses your location to find nearby flights and weather."
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - streamscapes
            CFBundleURLName: com.streamscapes.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf

  StreamscapesWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: ../packages/streamscapes-watch/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamscapes.app.watch
        PRODUCT_NAME: Streamscapes Watch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.streamscapes.app
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Streamscapes streams your heart rate and steps as live sound."
        DEVELOPMENT_TEAM: MAG2WYD297
    entitlements:
      path: ../packages/streamscapes-watch/Streamscapes.Watch.entitlements
